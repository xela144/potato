unbind r
bind r source-file ~/.tmux.conf

unbind C-b
set -g prefix C-s
bind C-s send-prefix

# images renderable
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g repeat-time 500
# set -g focus-events on
# set -g extended-keys on

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# split panes
bind-key H split-window -h
bind-key V split-window -v

# Enter resize mode with prefix + R
bind-key C-r switch-client -T resize

# In resize mode, C-{hjkl}
bind-key -T resize -r C-h resize-pane -L 2
bind-key -T resize -r C-j resize-pane -D 1
bind-key -T resize -r C-k resize-pane -U 1
bind-key -T resize -r C-l resize-pane -R 2

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'

# Dracula options
set -g @dracula-show-powerline true
set -g @dracula-fixed-location "Santa Cruz"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g status-position top


# Exit resize mode with Escape
bind-key -T resize Escape switch-client -T root

set -s set-clipboard on

# better copy mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Mimicking the behavior of entering visual mode in Vim, which is familiar to many users who use Vim keybindings.
bind v copy-mode

# C: Using C for "copy" can be intuitive.
bind C copy-mode

# y: Similar to the Vim command for "yank," which is often associated with copying.
bind y copy-mode

bind Enter copy-mode

# scrolling back
set -g history-limit 10000


# Initialize TMUX plugin manager. Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
